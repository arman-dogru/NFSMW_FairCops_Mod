; FairCops for Need for Speed: Most Wanted (2005) v1.3
; Put this file beside FairCops.asi in the scripts folder.
;
; FairCops DOES NOT create extra formal non-player pursuit objects.
; It redistributes the individual targets of cops that are already in pursuit,
; after the normal/Bartender pursuit manager has updated them.

[Main]
Enabled = 1

[Distribution]
; How often assignment COUNTS are rebalanced. Targets are enforced every
; pursuit-manager update, so vanilla/Bartender cannot immediately overwrite
; the delegated target on the next frame.
RebalanceFrames = 30

; Defaults make the player and every AI racer equally eligible.
IncludePlayer = 1
IncludeAIRacers = 1

; If there are fewer pursuing cops than racers, rotate which racers are covered
; so the same cars are not permanently ignored. At 60 FPS, 600 ~= 10 seconds.
; Set 0 to disable rotation.
UndersupplyRotationFrames = 600

[Compatibility]
; Recommended with Bartender. Static roadblock holders are left alone so the
; game's/Bartender's roadblock director keeps control of roadblock geometry.
SkipStaticRoadblocks = 1

; If another ASI has already replaced the CALL at 0x0043EF43 with another E8
; CALL, FairCops chains that target instead of discarding it. Leave enabled for
; mod-stack compatibility. Non-CALL patches are never overwritten.
AllowChainedCallHook = 1
